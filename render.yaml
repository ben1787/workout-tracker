projects:
  - name: Workout App
    environments:
      - name: Production
        services:
          - type: web
            name: workout-coach-ben
            runtime: node
            region: frankfurt
            plan: free
            buildCommand: npm ci && npm test
            startCommand: npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_VERSION
                value: 22.22.0
              # Dedicated free Supabase project, separate from Porter.
              - key: DATABASE_URL
                sync: false
              - key: DATABASE_SSL
                value: "true"
              - key: DATABASE_SSL_CA
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_MODEL
                value: gpt-6.1-sol
              - key: SETUP_TOKEN
                generateValue: true
