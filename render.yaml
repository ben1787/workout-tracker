projects:
  - name: Workout App
    environments:
      - name: Production
        databases:
          - name: workout-app-db
            databaseName: workout
            user: workout
            plan: free
            region: frankfurt
            ipAllowList: []
        services:
          - type: web
            name: workout-coach-ben
            runtime: node
            region: frankfurt
            plan: free
            buildCommand: npm ci && npm test
            startCommand: npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_VERSION
                value: 22.22.0
              - key: DATABASE_URL
                fromDatabase:
                  name: workout-app-db
                  property: connectionString
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_MODEL
                value: gpt-6.1-sol
              - key: SETUP_TOKEN
                generateValue: true
